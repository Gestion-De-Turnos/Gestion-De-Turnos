    <div class="contenedor">

        <main>
            <h2>RELLENE EL SIGUIENTE FORMULARIO PARA PEDIR UN TURNO</h2>
            <form>
                
                <fieldset>
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Género</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="masculino" name="genero" value="masculino" required>
                                <label class="form-check-label" for="masculino">Masculino</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="femenino" name="genero" value="femenino" required>
                                <label class="form-check-label" for="femenino">Femenino</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="otro" name="genero" value="otro" required>
                                <label class="form-check-label" for="otro">Otro</label>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <div class="row">
                        <div class="col-md-6">
                            <label for="motivo" class="form-label">Motivo de la Consulta</label>
                            <select class="form-select" id="motivo" name="motivo">
                                <option value="general">Consulta General</option>
                                <option value="especialidad">Consulta de Especialidad</option>
                                <option value="seguimiento">Seguimiento</option>
                                <option value="otro">Otro (especificar)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="especialidad" class="form-label">Especialidad Médica Solicitada</label>
                            <select class="form-select" id="especialidad" name="especialidad">
                                <option value="clinica_general">Clínica General</option>
                                <option value="pediatria">Pediatría</option>
                                <option value="cardiologia">Cardiología</option>
                                <option value="dermatologia">Dermatología</option>
                                <option value="ginecologia">Ginecología</option>
                                <option value="traumatologia">Traumatología</option>
                                <option value="otra">Otra (especificar)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="fecha_cita" class="form-label">Fecha y Hora Preferida para la Cita</label>
                            <input type="datetime-local" class="form-control" id="fecha_cita" name="fecha_cita">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">¿Es tu primera visita a este médico?</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="primera_visita_si" name="primera_visita" value="si">
                                <label class="form-check-label" for="primera_visita_si">Sí</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="primera_visita_no" name="primera_visita" value="no">
                                <label class="form-check-label" for="primera_visita_no">No</label>
                            </div>
                        </div>
                    </div>
                </fieldset>
            
                <fieldset>
                    <div class="row">
                        <div class="col-md-6">
                            <label for="seguro_medico" class="form-label">¿Tienes algún seguro médico?</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="seguro_si" name="seguro_medico" value="si">
                                <label class="form-check-label" for="seguro_si">Sí </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="seguro_no" name="seguro_medico" value="no">
                                <label class="form-check-label" for="seguro_no">No</label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <label for="antecedentes" class="form-label">Antecedentes Médicos Importantes</label>
                            <textarea class="form-control" id="antecedentes" name="antecedentes" rows="3"></textarea>
                        </div>
                        <div class="col-md-12">
                            <label for="medicamentos" class="form-label">Medicamentos que estás tomando actualmente</label>
                            <textarea class="form-control" id="medicamentos" name="medicamentos" rows="3"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">¿Tienes alguna alergia?</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="alergias_si" name="alergias" value="si">
                                <label class="form-check-label" for="alergias_si">Sí</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="alergias_no" name="alergias" value="no">
                                <label class="form-check-label" for="alergias_no">No</label>
                            </div>
                        </div>
                    </div>
                </fieldset>
            
                <fieldset>
                    <div class="row">
                        <div class="col-md-6">
                            <label for="contacto_preferido" class="form-label">¿Cómo prefieres ser contactado para confirmaciones y recordatorios?</label>
                            <select class="form-select" id="contacto_preferido" name="contacto_preferido">
                                <option value="telefono">Teléfono</option>
                                <option value="email">Correo Electrónico</option>
                                <option value="sms">SMS</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="asistencia" class="form-label">¿Necesitas algún tipo de asistencia especial durante tu visita?</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="asistencia_si" name="asistencia" value="si">
                                <label class="form-check-label" for="asistencia_si">Sí </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="asistencia_no" name="asistencia" value="no">
                                <label class="form-check-label" for="asistencia_no">No</label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <label for="comentarios" class="form-label">Comentarios Adicionales o Instrucciones Especiales</label>
                            <textarea class="form-control" id="comentarios" name="comentarios" rows="3"></textarea>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <div class="row">
                        <div class="col-md-12">
                            <label for="consentimiento" class="form-label">Consentimiento para el uso de datos personales según las políticas de privacidad del hospital</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="consentimiento" name="consentimiento" value="acepto" required>
                                <label class="form-check-label" for="consentimiento">Acepto</label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <label for="comunicaciones" class="form-label">Consentimiento para recibir comunicaciones relacionadas con la cita</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="comunicaciones_si" name="comunicaciones" value="acepto">
                                <label class="form-check-label" for="comunicaciones_si">Acepto</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="comunicaciones_no" name="comunicaciones" value="no_acepto">
                                <label class="form-check-label" for="comunicaciones_no">No acepto</label>
                            </div>
                        </div>
                    </div>
                </fieldset>
            
                <fieldset>
                    <div class="row">
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-primary" style="color: white; background-color: rgb(46, 106, 54); border: 2px solid white; font-weight: bold;">Solicitar Turno</button>
                        </div>
                    </div>
                </fieldset>
            </form>
        </main>

</div>  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        // Función para validar el formulario
        function validarFormulario(event) {
            var formulario = event.target;
    
            if (!formulario.checkValidity()) {
                event.preventDefault(); 
                event.stopPropagation(); 
                alert("Por favor, complete todos los campos requeridos.");
            }
        }
    
        document.querySelector("form").addEventListener("submit", validarFormulario);
    
        function mostrarConfirmacion(event) {
            event.preventDefault();
    
            alert("¡Su solicitud de turno ha sido enviada exitosamente!");
        }
    
        document.querySelector("form").addEventListener("submit", mostrarConfirmacion);
        </script>
    </body>
